<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3efe4"><title>100 DAY · potato log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@700;900&display=swap');
:root{--bg:#f3efe4;--paper:#fbfaf6;--ink:#30352c;--muted:#858b7c;--line:#deded2;--green:#8fa96b;--green2:#dfe8ce}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{width:min(560px,100%);margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font:900 19px Nunito}.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:var(--paper);border-radius:12px}.profile{background:var(--ink);color:#f7f1df;border-radius:22px;padding:18px;display:flex;gap:16px;align-items:center}.potato{width:88px;height:88px;display:grid;place-items:center;background:#566248;border-radius:22px;font-size:54px}.profile h1{margin:0;font:900 22px Nunito}.profile p{display:none}.dayrow{display:flex;gap:7px;margin-top:8px}.chip{font-size:10px;padding:6px 8px;border-radius:9px;background:#454b3e}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;font-weight:900;font-size:15px}.hint{font-size:10px;color:var(--muted);font-weight:400}.weightline{display:flex;justify-content:space-between;align-items:end}.weight{font:900 29px Nunito}.goal{font-size:10px;color:var(--muted)}.weightbtn{margin-top:10px;width:100%;border:1px solid #a9ba8e;background:#edf2e4;border-radius:11px;padding:10px;color:#53643e;font-weight:900;font-size:11px}.graph{height:115px;margin-top:9px;position:relative;border-bottom:1px solid var(--line)}.graph svg{width:100%;height:100%}.goalLine{position:absolute;left:0;right:0;border-top:1px dashed #a6b391;z-index:1}.goalLabel{position:absolute;right:0;top:-17px;font-size:9px;color:#718158}.timeline{position:relative}.timeline:before{content:"";position:absolute;left:48px;top:10px;bottom:10px;width:1px;background:#d6d8cc}.row{display:grid;grid-template-columns:52px 1fr;gap:9px;position:relative;min-height:69px}.time{font:10px Nunito;color:#8b9183;padding-top:10px}.event{border:1px solid var(--line);background:#fffefa;border-radius:13px;padding:10px 11px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}.event.empty{border-style:dashed;background:#f7f6ef}.eventmain{display:flex;gap:9px;align-items:center;min-width:0}.emoji{font-size:20px}.etitle{font-size:12px;font-weight:900}.emeta{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.add{border:1px solid #a9ba8e;background:#edf2e4;color:#53643e;border-radius:8px;padding:6px 8px;font-size:10px;font-weight:900}.tag{font-size:9px;border-radius:7px;padding:5px 7px;background:#edf2e4;color:#53643e}.tag.warn{background:#f6edd8;color:#8b6a2d}.tag.bad{background:#f7e1dc;color:#9b5147}.fastbox{background:#f5f4ec;border:1px solid var(--line);border-radius:12px;padding:11px}.fastbox .big{font:900 22px Nunito}.fastbox small{color:var(--muted);font-size:9px}.assess{display:flex;align-items:center;gap:13px}.face{width:68px;height:68px;display:grid;place-items:center}.stars{font:17px Nunito;letter-spacing:1px}.assess b{font-size:14px}.assess p{margin:3px 0 0;color:var(--muted);font-size:10px}.nav{position:fixed;left:0;right:0;bottom:0;background:#f3efeef0;border-top:1px solid var(--line);z-index:5;backdrop-filter:blur(8px)}.navin{width:min(560px,100%);margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;padding:7px 12px calc(7px + env(safe-area-inset-bottom));gap:8px}.nav button{border:0;background:none;color:#8b9183;padding:8px;font-size:10px}.nav button.active{color:#53643e;font-weight:900}.modal{position:fixed;inset:0;background:#1e211acc;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:min(560px,100%);margin:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet h2{margin:0 0 14px;font-size:18px}.close{float:right;border:0;background:none;font-size:25px}.field{margin:13px 0}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);background:#fffefa;border-radius:10px;padding:11px}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#f7f6ef;border-radius:9px;padding:9px 11px;font-size:10px}.pill.sel{background:var(--green2);border-color:#9db27e;font-weight:900}.primary,.secondary{width:100%;border-radius:11px;padding:12px;font-weight:900;margin-top:7px}.primary{border:0;background:var(--ink);color:#fff9e9}.secondary{border:1px solid var(--line);background:#f7f6ef}.history details{background:#fffefa;border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0}.history summary{cursor:pointer;font-size:11px;font-weight:900}.hrow{display:flex;gap:8px;padding:6px 0;border-top:1px solid #ecece3;font-size:10px}.htime{font:10px Nunito;color:#7f8777;width:40px}.emptyhist{font-size:10px;color:var(--muted);padding:7px 0}.routine-title{font:900 18px Nunito}.routine-sub{font-size:10px;color:var(--muted)}.facegrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}.dayface{aspect-ratio:1;border:1px solid var(--line);background:#fffefa;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}.dayface .dn{font:8px Nunito;color:var(--muted);margin-top:3px}.routine-detail{margin-top:12px;background:#f5f4ec;border-radius:12px;padding:12px;font-size:11px;line-height:1.8}
.potface{width:68px;height:68px;display:inline-block;position:relative}.potface svg{width:100%;height:100%;display:block}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:var(--ink);color:#fff9e9;padding:9px 13px;border-radius:9px;font-size:10px;font-weight:900;opacity:0;z-index:30}.toast.on{opacity:1}
</style>
<style>
.slot-actions{display:flex;gap:6px;align-items:center;margin-left:auto}
.slot-btn{border:0;border-radius:10px;padding:6px 10px;background:#f4efe8;color:#5d4a38;font-size:12px;cursor:pointer}
.slot-btn.x{width:30px;padding:6px 0;background:#f1f1f1;color:#777;font-weight:700}
.slot.done .slot-actions .slot-btn{display:none}
.slot.done .slot-actions .slot-btn.edit{display:inline-flex}
.slot.missed .slot-content{opacity:.55}
.slot.missed .slot-actions .slot-btn.edit{display:inline-flex}
</style>

<style>
.rowactions{display:flex;gap:5px;align-items:center;margin-left:auto}
.xbtn,.editbtn{border:0;border-radius:9px;height:30px;min-width:30px;padding:0 8px;background:#f1f0ed;color:#777;font-size:14px;font-weight:700;cursor:pointer}
.editbtn{font-size:11px;font-weight:600;color:#665544;background:#f5efe6}
.event{display:flex;align-items:center;gap:8px}
.eventmain{flex:1;display:flex;align-items:center;min-width:0}
.event.missed{opacity:.58}
.event.missed .emeta{font-weight:700;color:#888}
</style>
<style>
.time-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fffefa;border-radius:10px;padding:10px 11px;color:var(--ink);font-size:11px}.time-toggle span:last-child{font-size:9px;color:var(--muted)}
.split-input{display:grid;grid-template-columns:1fr 1fr;gap:8px}.split-input>div{background:#f7f6ef;border:1px solid var(--line);border-radius:10px;padding:8px}.split-input span{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}.split-input input{width:100%;border:1px solid var(--line);background:#fffefa;border-radius:8px;padding:9px}
.potato{display:grid;place-items:center;overflow:hidden}.potato .potface{width:78px;height:78px}.assess .potface{width:64px;height:64px}.dayface .potface{width:42px;height:42px}
</style></head><body>
<div class="app"><header class="top"><div class="brand">100 DAY · potato log</div><button class="iconbtn" onclick="settings()">⚙</button></header>
<section class="profile"><div class="potato" id="profilePotato"></div><div><h1>이감자</h1><div class="dayrow"><span class="chip" id="dayChip">DAY 1 / 100</span><span class="chip">GOAL 55.0 kg</span></div></div></section>
<section class="card"><div class="title"><span>⚖️ 체중</span><span class="hint">아침에 한 번</span></div><div class="weightline"><div><div class="goal">오늘</div><div class="weight" id="currentWeight">— kg</div></div><div class="goal">목표 55.0 kg</div></div><button class="weightbtn" onclick="weightModal()">오늘 아침 체중 기록하기</button><div class="graph" id="graph"></div></section>
<section class="card"><div class="title"><span>오늘의 기록</span><span class="hint">기본 시간 적용 · 필요할 때만 상세시간 수정</span></div><div class="timeline" id="timeline"></div></section>
<section class="card"><div class="title"><span>🌙 공복시간</span></div><div class="fastbox"><div class="big" id="fastingNow">—</div><small id="fastingMsg">전날 마지막 섭취와 오늘 첫 섭취를 기록하면 계산돼요.</small></div></section>
<section class="card"><div class="title"><span>🥔 오늘의 판정</span></div><div class="assess"><div class="face" id="face">🥔</div><div><div class="stars" id="stars">☆☆☆☆☆</div><b id="assessTitle">아직 기록을 시작하지 않았어요</b><p id="assessMsg">오늘의 식사와 운동을 기록하면 판정돼요.</p></div></div></section></div>
<nav class="nav"><div class="navin"><button class="active" id="navToday" onclick="showToday()">🥔 오늘</button><button id="navHistory" onclick="historyView()">📅 100일</button><button id="navRoutine" onclick="routineView()">🌱 루틴</button></div></nav>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='potato_log_100_v2',goal=55;
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{startDate:null,days:{},weightLog:[]};if(!db.startDate)db.startDate=localDate();db.days=db.days||{};db.weightLog=db.weightLog||[];save();
function migrate(){Object.keys(db.days||{}).forEach(k=>{const x=db.days[k]?.slots?.workout;if(x&&x.anaerobic==null&&x.aerobic==null){if(x.detail==='유산소'){x.aerobic=Number(x.mins||0);x.anaerobic=0}else{x.anaerobic=Number(x.mins||0);x.aerobic=0}}});save()}migrate();const slots=[
 {id:'breakfast',icon:'🌅',title:'아침',type:'meal',defaultTime:'06:30',empty:'아침 기록'},
 {id:'lunch',icon:'🍚',title:'점심',type:'meal',defaultTime:'11:30',empty:'식사 기록'},
 {id:'cafe',icon:'☕',title:'카페',type:'quick',defaultTime:'12:30',empty:'카페 기록'},
 {id:'workout',icon:'🏋️',title:'운동',type:'workout',defaultTime:'17:30',empty:'운동 기록'},
 {id:'postwork',icon:'🥛',title:'운동 후 보충',type:'quick',defaultTime:'18:30',empty:'보충 기록'},
 {id:'dinner',icon:'🍽️',title:'저녁',type:'meal',defaultTime:'19:00',empty:'저녁 기록'}
];
function localDate(d=new Date()){return d.toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'})}function dateObj(s){let[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){let k=localDate();db.days[k]=db.days[k]||{slots:{}};return db.days[k]}function closeModal(){document.getElementById('modal').classList.remove('show')}function modal(x){document.getElementById('modalContent').innerHTML=x;document.getElementById('modal').classList.add('show')}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}function pick(e){e.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('sel'));e.classList.add('sel')}
function dayNo(k=localDate()){return Math.floor((dateObj(k)-dateObj(db.startDate))/86400000)+1}
function fmtMin(m){let h=Math.floor(m/60),n=m%60;return h?`${h}시간 ${n?n+'분':''}`.trim():`${n}분`}
function intakes(k){return Object.values(db.days[k]?.slots||{}).filter(x=>x&&x.consumed!==false&&x.time).map(x=>({m:x.time.split(':')[0]*60+x.time.split(':')[1]*1,text:x.text||''})).sort((a,b)=>a.m-b.m)}
function prevDay(k){let d=dateObj(k);d.setDate(d.getDate()-1);return localDate(d)}
function fasting(k){let a=intakes(prevDay(k)),b=intakes(k);if(!a.length||!b.length)return null;return 1440-a[a.length-1].m+b[0].m}function syncFasting(k){let f=fasting(k);if(f!=null){db.days[k]=db.days[k]||{slots:{}};db.days[k].fasting=f}else if(db.days[k]){delete db.days[k].fasting}}
function openSlot(id){
  const s=slots.find(x=>x.id===id), old=today().slots[id], t=old?.time||s.defaultTime;
  let h=`<h2>${s.icon} ${s.title}</h2>
  <div class="field"><label>시간</label>
    <button class="time-toggle" onclick="toggleTime()"><span id="timeLabel">${t}</span><span>시간 수정</span></button>
    <input id="time" type="time" value="${t}" style="display:none;margin-top:7px">
  </div>`;
  if(s.type==='meal'){
    const skipped=old?.consumed===false;
    h+=`<div class="field"><label>식사</label><div class="pills">
      <button class="pill ${skipped?'sel':''}" data-v="skip" onclick="pick(this)">거름</button>
      <button class="pill ${old&&!skipped?'sel':''}" data-v="eat" onclick="pick(this)">먹음</button>
    </div></div>
    <div id="mealFields" style="${skipped?'display:none':''}">
      <div class="field"><label>먹은 것</label><input id="txt" value="${old&&!skipped?esc(old.text):''}" placeholder="예: 구내식당, 파스타"></div>
      <div class="field"><label>먹은 양</label><div class="pills">${['소식','적당','배부름','과식'].map(v=>`<button class="pill ${v===(old?.amount||'적당')?'sel':''}" data-v="${v}" onclick="pick(this)">${v}</button>`).join('')}</div></div>
    </div>`;
  } else if(s.type==='quick'){
    const missed=old?.status==='missed';
    h+=`<div class="field"><label>기록</label><input id="txt" value="${missed?'':esc(old?.text)}" placeholder="${s.id==='cafe'?'예: 아이스 라떼':'예: 두유, 프로틴 음료'}"></div>`;
  } else if(s.type==='workout'){
    h+=`<div class="field"><label>운동 종류</label><div class="pills">${['PT','개인운동'].map(v=>`<button class="pill ${v===(old?.kind||'PT')?'sel':''}" data-v="${v}" onclick="pick(this)">${v}</button>`).join('')}</div></div>
    <div class="field"><label>운동 시간</label>
      <div class="split-input"><div><span>무산소</span><input id="anaerobic" type="number" min="0" step="1" value="${old?.anaerobic??(old?.detail==='근력'?old?.mins:'')}" placeholder="분"></div>
      <div><span>유산소</span><input id="aerobic" type="number" min="0" step="1" value="${old?.aerobic??(old?.detail==='유산소'?old?.mins:'')}" placeholder="분"></div></div>
    </div>`;
  }
  h+=`<button class="primary" onclick="saveSlot('${id}')">저장하기</button>${old?`<button class="secondary" onclick="delSlot('${id}')">이 기록 삭제</button>`:''}`;
  modal(h);
  if(s.type==='meal'){
    document.querySelectorAll('[data-v="skip"],[data-v="eat"]').forEach(btn=>btn.addEventListener('click',()=>{
      const isSkip=btn.dataset.v==='skip', f=document.getElementById('mealFields');
      if(f)f.style.display=isSkip?'none':'block';
      document.querySelectorAll('[data-v="skip"],[data-v="eat"]').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');
    }));
  }
}
function saveSlot(id){
  const s=slots.find(x=>x.id===id), t=document.getElementById('time')?.value||s.defaultTime;
  if(s.type==='meal'){
    const mode=document.querySelector('.pill.sel[data-v="skip"],.pill.sel[data-v="eat"]')?.dataset.v;
    if(mode==='skip') today().slots[id]={time:t,consumed:false,status:'missed'};
    else{
      const txt=document.getElementById('txt')?.value.trim();
      const amount=document.querySelector('#mealFields .pill.sel[data-v]')?.dataset.v;
      if(!txt){toast('먹은 내용을 입력해주세요');return}
      today().slots[id]={time:t,text:txt,amount:amount||'적당',consumed:true};
    }
  }else if(s.type==='quick'){
    const txt=document.getElementById('txt')?.value.trim();
    if(!txt){toast('내용을 입력해주세요');return}
    today().slots[id]={time:t,text:txt,consumed:true};
  }else if(s.type==='workout'){
    const kind=document.querySelector('.pill.sel[data-v="PT"],.pill.sel[data-v="개인운동"]')?.dataset.v||'PT';
    const anaerobic=Math.max(0,Number(document.getElementById('anaerobic')?.value||0));
    const aerobic=Math.max(0,Number(document.getElementById('aerobic')?.value||0));
    if(anaerobic+aerobic<=0){toast('운동 시간을 입력해주세요');return}
    today().slots[id]={time:t,kind,anaerobic,aerobic,mins:anaerobic+aerobic,consumed:false};
  }
  syncFasting(localDate());save();closeModal();render();toast('기록 저장');
}
function delSlot(id){
  if(confirm('이 기록을 삭제할까요?')){
    delete today().slots[id];
    syncFasting(localDate());
    save();closeModal();render();
  }
}
function markMissed(id){
  const s=slots.find(x=>x.id===id);
  today().slots[id]={time:s.defaultTime,consumed:false,status:'missed'};
  syncFasting(localDate());save();render();toast('× 기록');
}
function timeline(){
  const d=today(), saved=d.slots||{};
  const items=slots.map(s=>({s,x:saved[s.id]})).sort((a,b)=>(a.x?.time||a.s.defaultTime).localeCompare(b.x?.time||b.s.defaultTime));
  document.getElementById('timeline').innerHTML=items.map(({s,x})=>x?row(s,x):emptyRow(s)).join('');
}
function emptyRow(s){
  return `<div class="row"><div class="time">${s.defaultTime}</div><div style="flex:1"><div class="event empty">
  <div class="eventmain"><span class="emoji">${s.icon}</span><div><div class="etitle">${s.title}</div><div class="emeta">기록 없음</div></div></div>
  <div class="rowactions"><button class="add" onclick="openSlot('${s.id}')">+ 기록</button><button class="xbtn" onclick="markMissed('${s.id}')">×</button></div>
  </div></div></div>`;
}
function row(s,x){
  const missed=x.status==='missed'||x.consumed===false;
  let m='×';
  if(!missed){
    if(s.id==='workout'){
      const parts=[];if(x.anaerobic)parts.push(`무산소 ${x.anaerobic}분`);if(x.aerobic)parts.push(`유산소 ${x.aerobic}분`);
      m=`${x.kind||'운동'} · ${parts.join(' + ')}`;
    }else m=x.text||'기록';
  }
  return `<div class="row"><div class="time">${x.time}</div><div style="flex:1"><div class="event ${missed?'missed':''}" onclick="openSlot('${s.id}')">
    <div class="eventmain"><span class="emoji">${s.icon}</span><div><div class="etitle">${s.title}</div><div class="emeta">${esc(m)}</div></div></div>
    ${x.amount&&!missed?`<span class="tag ${x.amount==='과식'?'bad':x.amount==='배부름'?'warn':''}">${x.amount}</span>`:''}
    <div class="rowactions"><button class="editbtn" onclick="event.stopPropagation();openSlot('${s.id}')">수정</button><button class="xbtn" onclick="event.stopPropagation();markMissed('${s.id}')">×</button></div>
  </div></div></div>`;
}
function weightModal(){modal(`<h2>⚖️ 오늘 아침 체중</h2><div class="field"><label>체중 (kg)</label><input id="weight" type="number" step=".1" value="${today().weight||''}" placeholder="예: 58.4"></div><button class="primary" onclick="saveWeight()">저장하기</button>`)}
function saveWeight(){let w=+document.getElementById('weight').value;if(w<30||w>200)return;today().weight=w; syncFasting(localDate()); db.weightLog=db.weightLog.filter(x=>x.d!==localDate());db.weightLog.push({d:localDate(),w});db.weightLog.sort((a,b)=>a.d.localeCompare(b.d));save();closeModal();render()}
function graph(){let e=document.getElementById('graph'),a=db.weightLog.map(x=>x.w),W=500,H=115,min=Math.min(54.5,...a),max=Math.max(63,...a),y=v=>H-8-(v-min)/Math.max(1,max-min)*(H-16),pts=a.map((v,i)=>`${8+i/Math.max(1,a.length-1)*484},${y(v)}`).join(' '),gy=y(goal);e.innerHTML=`<div class="goalLine" style="top:${gy}px"><span class="goalLabel">GOAL 55.0</span></div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#8fa96b" stroke-width="3"/>${a.map((v,i)=>`<circle cx="${8+i/Math.max(1,a.length-1)*484}" cy="${y(v)}" r="4" fill="#8fa96b"/>`).join('')}</svg>`}
function faceClass(s){return ['','bad','meh','good','great','best'][s]||''}

      <path d="M12 21v4M23 21v4M35 21v4M46 21v4" stroke="#6f9aaa" stroke-width="2" stroke-linecap="round"/>`;

    arms=`<path d="M11 35L6 32M45 35l5-3" stroke="${dark}" stroke-width="3" stroke-linecap="round"/>`;
    eyes=`<rect x="14" y="27" width="5" height="5" rx="1" fill="#493329"/><rect x="37" y="27" width="5" height="5" rx="1" fill="#493329"/>`;
    mouth=`<path d="M25 39q3 3 6 0" fill="none" stroke="#493329" stroke-width="2.4" stroke-linecap="round"/>`;
    extra=`<path d="M28 14q-3-8 2-10q5 4 1 10M31 14q4-7 9-7" fill="#6d9954" stroke="#4e763e" stroke-width="1.5"/>`;
  }else if(s===4){
    arms=`<path d="M11 34L3 27M45 34l8-7" stroke="${dark}" stroke-width="3.2" stroke-linecap="round"/>`;
    eyes=`<path d="M14 28q4-6 9 0M33 28q4-6 9 0" fill="none" stroke="#493329" stroke-width="2.8" stroke-linecap="round"/>`;
    mouth=`<path d="M22 36q6 10 12 0" fill="#493329"/>`;
    extra=`<path d="M27 13q-2-7 3-10q5 3 2 10" fill="#76a75b" stroke="#527d43" stroke-width="1.5"/>
      <path d="M5 14l2 2M51 14l-2 2M3 21h4M53 21h-4" stroke="#e2b14f" stroke-width="2.4" stroke-linecap="round"/>`;
  }else{
    arms=`<path d="M12 37L3 28M44 37l9-9" stroke="${dark}" stroke-width="3.5" stroke-linecap="round"/>`;
    eyes=`<path d="M13 28l3 3 4-6 4 6 3-3M32 28l3 3 4-6 4 6 3-3" fill="none" stroke="#493329" stroke-width="2.5" stroke-linejoin="round"/>`;

function label(s){return ['','많이 벗어난 하루','아쉬운 하루','무난한 하루','뿌듯한 하루','아주 좋은 하루'][s]||''}
function score(k){
  const d=db.days[k], s=d?.slots||{};
  if(!d||Object.keys(s).length===0)return 0;
  const has=id=>!!s[id], skipped=id=>has(id)&&s[id].consumed===false;
  const amount=id=>s[id]?.amount||null;

  // Core day score: 11 points total.
  // Breakfast 2, lunch 2, dinner 2, exercise 3, fasting 1.
  // Cafe / post-workout are logging-only and never required.
  let p=0, complete=true;

  if(has('breakfast')) p += skipped('breakfast') ? 2 : (amount('breakfast')==='과식'?0:1); else complete=false;
  if(has('lunch')) p += amount('lunch')==='소식'?2:amount('lunch')==='적당'?2:amount('lunch')==='배부름'?1:0; else complete=false;
  if(has('dinner')) p += skipped('dinner') ? 2 : (amount('dinner')==='소식'?2:amount('dinner')==='적당'?1:0); else complete=false;

  let exercised=false;
  if(has('workout')&&!skipped('workout')){
    const an=Number(s.workout.anaerobic||0), ae=Number(s.workout.aerobic||0);
    exercised=(an+ae)>0;
    if(exercised)p+=3;
  }else complete=false;

  const f=d.fasting!=null?d.fasting:fasting(k);
  if(f!=null)p += f>=16*60?1:0;

  // Overeating is a strong negative signal.
  ['breakfast','lunch','dinner'].forEach(id=>{if(amount(id)==='과식')p-=2});

  // 5 points require exercise, no overeating, and a well-managed meal pattern.
  const hasOvereat=['breakfast','lunch','dinner'].some(id=>amount(id)==='과식');
  let result = p>=9?5:p>=7?4:p>=5?3:p>=3?2:1;
  if(!exercised || hasOvereat) result=Math.min(result,4);
  if(!complete) result=Math.min(result,4);
  return Math.max(1,result);
}
function assess(){
  const s=score(localDate());
  if(!s)return ['🥔','☆☆☆☆☆','아직 기록 중','오늘의 기록을 입력하면 판정이 표시돼요.'];
  const msgs={
    5:'식사와 운동을 모두 잘 챙긴 아주 좋은 하루예요.',
    4:'전체적으로 잘 관리한 하루예요.',
    3:'크게 벗어나지 않은 무난한 하루예요.',
    2:'조금 아쉬운 하루예요. 내일 다시 조절해봐요.',
    1:'오늘은 목표에서 많이 벗어난 하루예요.'
  };
  return [face(s),'★'.repeat(s)+'☆'.repeat(5-s),label(s),msgs[s]];
}
function renderAssess(){
  const [icon,stars,title,msg]=assess();
  document.getElementById('face').innerHTML=icon;
  document.getElementById('stars').textContent=stars;
  document.getElementById('assessTitle').textContent=title;
  document.getElementById('assessMsg').textContent=msg;
}
function renderFast(){let f=fasting(localDate());document.getElementById('fastingNow').textContent=f==null?'—':fmtMin(f);document.getElementById('fastingMsg').textContent=f==null?'전날 마지막 섭취와 오늘 첫 섭취를 기록하면 계산돼요.':`전날 마지막 섭취 → 오늘 첫 섭취 · ${fmtMin(f)}`}
function setNav(id){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}function showToday(){setNav('navToday');closeModal();render()}
function historyView(){setNav('navHistory');let st=dateObj(db.startDate),rows='';for(let i=0;i<100;i++){let d=new Date(st);d.setDate(d.getDate()+i);let k=localDate(d),x=db.days[k],a=Object.entries(x?.slots||{}).map(([id,v])=>({s:slots.find(q=>q.id===id),x:v})).filter(a=>a.s).sort((a,b)=>a.x.time.localeCompare(b.x.time));rows+=`<details><summary>DAY ${i+1} · ${k}${x?.weight?' · ⚖️ '+x.weight.toFixed(1)+' kg':''}</summary><div>${a.length?a.map(q=>`<div class="hrow"><span class="htime">${q.x.time}</span><span>${q.s.icon} ${q.s.title} · ${q.x.kind?`${q.x.kind} · ${q.x.anaerobic?'무산소 '+q.x.anaerobic+'분':''}${q.x.anaerobic&&q.x.aerobic?' + ':''}${q.x.aerobic?'유산소 '+q.x.aerobic+'분':''}`:q.x.text}${q.x.amount?' · '+q.x.amount:''}</span></div>`).join(''):'<div class="emptyhist">기록 없음</div>'}${db.days[k]?.fasting!=null?`<div class="hrow"><span class="htime">🌙</span><span>공복 ${fmtMin(db.days[k].fasting)}</span></div>`:''}</div></details>`}modal(`<h2>📅 100일 기록</h2><div class="history">${rows}</div>`)}
function routineView(){setNav('navRoutine');let st=dateObj(db.startDate),cells='';for(let i=0;i<100;i++){let d=new Date(st);d.setDate(d.getDate()+i);let k=localDate(d),s=score(k);cells+=`<button class="dayface" onclick="routineDay('${k}')">${s?face(s):'🥔'}<span class="dn">${i+1}</span></button>`}modal(`<h2>🌱 루틴</h2><div class="routine-sub">100일간의 오늘의 판정</div><div class="facegrid">${cells}</div>`)}
function routineDay(k){let s=score(k),d=db.days[k];modal(`<h2>🥔 ${k}</h2><div class="routine-detail">${s?face(s)+' &nbsp; <b>'+`★`.repeat(s)+`☆`.repeat(5-s)+`</b><br><b>${label(s)}</b>`:'🥔 기록 없음'}${d?.weight?`<br>체중 ${d.weight.toFixed(1)} kg`:''}${fasting(k)!=null?`<br>공복 ${fmtMin(fasting(k))}`:''}</div><button class="secondary" onclick="routineView()">루틴으로 돌아가기</button>`)}
function settings(){modal(`<h2>⚙️ 기록 관리</h2><button class="primary" onclick="backup()">💾 데이터 백업</button><button class="secondary" onclick="document.getElementById('restore').click()">📂 데이터 복구</button><input id="restore" type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"><button class="secondary" onclick="resetAll()">모든 기록 초기화</button>`)}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='potato-log-backup.json';a.click()}
function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{const next=JSON.parse(r.result);if(!next||typeof next!=='object'||!next.startDate||!next.days||!next.weightLog)throw new Error('invalid');db=next;backfillFasting();closeModal();render()}catch(e){alert('백업 파일이 올바르지 않아요.')}};r.readAsText(f)}
function resetAll(){if(confirm('모든 기록을 삭제할까요?')){db={startDate:localDate(),days:{},weightLog:[]};save();closeModal();render()}}
function backfillFasting(){Object.keys(db.days).forEach(k=>syncFasting(k));save()}backfillFasting();

function render(){document.getElementById('profilePotato').innerHTML=face(3);document.getElementById('dayChip').textContent=`DAY ${Math.max(1,Math.min(100,dayNo()))} / 100`;document.getElementById('currentWeight').textContent=today().weight?today().weight.toFixed(1)+' kg':'— kg';timeline();graph();renderFast();renderAssess()}render();
</script></body></html>
